[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfix-api"
version = "0.1.0"
description = "Python API and LabVIEW-facing TCP/UDP gateway for Hilscher CIFX PROFINET cards"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gui = ["PySide6>=6.5"]
build = ["pyinstaller>=6.5"]

[project.scripts]
cfix-gateway = "cfix_api.gateway.cli:main"
cfix-gateway-gui = "cfix_api.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
